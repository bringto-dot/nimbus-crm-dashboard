<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Nimbus CRM — clients, deals and tasks in one place." />
    <title>Nimbus CRM</title>
    <script>
      // Applied before first paint so the theme never flashes.
      try {
        var stored = JSON.parse(localStorage.getItem('crm-preferences') || 'null')
        var theme = stored && stored.state && stored.state.theme
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.classList.toggle('dark', theme === 'dark')
      } catch (e) {}
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
